.reader-header {

.page-field {

.read-area { grid-column: 2; position: relative; min-height: 0; min-width: 0; }
.read-stage {

  height: 100%;

.paper-frame {

const ZOOM_LEVELS = [.75, 1, 1.25, 1.5, 1.75, 2];

function spreadFor(page, total, singlePage = false) {
  if (singlePage || page === 1 || page === total) return [page];
  const left = page - page % 2;
  return left + 1 < total ? [left, left + 1] : [left];
}

function stepFrom(spread, step, total) {
  return step < 0 ? Math.max(1, spread[0] - 1) : Math.min(total, spread.at(-1) + 1);
}

function spreadLabel(spread) {
  return spread.join('–');
}

function bindPageEntry(form, input, onPage, label) {
  const go = () => {
    const value = input.value.trim();
    if (/^\d+$/.test(value)) onPage(Number(value));
    input.value = label();
  };
  input.addEventListener('focus', () => input.select());
  input.addEventListener('change', go);
  input.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.isComposing) return;
    event.preventDefault();
    go();
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    go();
  });
}

function makeLayer(className) {
  const layer = document.createElement('div');
  layer.className = className;
  return layer;
}

function copyPaper(source) {
  const copy = source.cloneNode(false);
  if (source instanceof HTMLCanvasElement) copy.getContext('2d').drawImage(source, 0, 0);
  return copy;
}

function relativeTo(box, origin) {
  return { x: box.left - origin.left, y: box.top - origin.top, width: box.width, height: box.height };
}

function position(layer, { x, y, width, height }) {
  Object.assign(layer.style, { left: x + 'px', top: y + 'px', width: width + 'px', height: height + 'px' });
}

class BookView {
  constructor(stage, frame, onTurn) {
    this.stage = stage;
    this.frame = frame;
    this.onTurn = onTurn;
    this.pages = [];
    this.zoom = 1;
    this.motion = matchMedia('(prefers-reduced-motion: reduce)');

    stage.addEventListener('pointerdown', event => this.pointerDown(event));
    stage.addEventListener('pointerup', event => this.pointerUp(event));
    for (const name of ['pointercancel', 'pointerleave']) {
      stage.addEventListener(name, () => { this.gesture = null; });
    }
    stage.addEventListener('click', event => this.clickPage(event));
    this.motion.addEventListener('change', () => this.stopTurn());
    if ('ResizeObserver' in window) new ResizeObserver(() => this.fit()).observe(stage);
    else window.addEventListener('resize', () => this.fit());
  }

  show(pages, direction = 0) {
    this.stopTurn();
    const canTurn = direction && this.zoom === 1 && !this.motion.matches && this.pages.length;
    const old = canTurn ? [...this.frame.querySelectorAll('.book-page')].map((leaf, index) => ({
      paper: this.pages[index].paper, box: leaf.getBoundingClientRect(),
    })) : [];
    const shelf = makeLayer('book-pages');
    const ratios = pages.map(({ width, height }) => width / height);
    this.ratio = ratios.reduce((sum, ratio) => sum + ratio, 0);
    const leaves = pages.map(({ paper }, index) => {
      const leaf = makeLayer('book-page');
      if (pages.length === 2) leaf.dataset.side = index === 0 ? 'left' : 'right';
      leaf.style.width = (ratios[index] / this.ratio) * 100 + '%';
      leaf.append(paper);
      shelf.append(leaf);
      return leaf;
    });
    this.pages = pages;
    this.frame.replaceChildren(shelf);
    this.frame.classList.toggle('is-spread', pages.length === 2);
    this.stage.scrollTo(0, 0);
    this.fit();
    if (old.length && this.size) this.playTurn(old, leaves, direction);
  }

  clear() {
    this.stopTurn();
    this.frame.replaceChildren();
    this.frame.classList.remove('is-spread');
    this.frame.style.removeProperty('--book-width');
    this.frame.style.removeProperty('--book-height');
    this.stage.classList.remove('is-zoomed');
    this.pages = [];
    this.size = null;
    this.zoom = 1;
    this.gesture = null;
    this.ignoreClick = false;
  }

  setZoom(zoom) {
    this.zoom = zoom;
    this.stage.classList.toggle('is-zoomed', zoom > 1);
    this.fit();
  }

  fit() {
    if (!this.pages.length) return;
    const style = getComputedStyle(this.stage);
    const width = this.stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const height = this.stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    if (width <= 0 || height <= 0) return;
    const fittedHeight = Math.min(height, width / this.ratio) * this.zoom;
    const fittedWidth = fittedHeight * this.ratio;
    if (this.size?.width === fittedWidth && this.size?.height === fittedHeight) return;
    this.stopTurn();
    this.size = { width: fittedWidth, height: fittedHeight };
    this.frame.style.setProperty('--book-width', fittedWidth + 'px');
    this.frame.style.setProperty('--book-height', fittedHeight + 'px');
  }

  stopTurn() {
    this.finishTurn?.();
  }

  playTurn(old, leaves, direction) {
    const forward = direction > 0;
    const front = old[forward ? old.length - 1 : 0];
    const targetIndex = forward ? 0 : leaves.length - 1;
    const target = leaves[targetIndex];
    const origin = this.frame.getBoundingClientRect();
    const start = relativeTo(front.box, origin);
    const end = relativeTo(target.getBoundingClientRect(), origin);
    const hingeStart = start.x + (forward ? 0 : start.width);
    const hingeEnd = end.x + (forward ? end.width : 0);
    if (Math.min(start.width, start.height, end.width, end.height) < 1) return;

    const scene = makeLayer('book-turn-scene');
    const hinge = makeLayer('book-hinge');
    const sheet = makeLayer('book-turn-sheet');
    const outer = makeLayer('book-face front');
    const inner = makeLayer('book-face back');
    const frontShade = makeLayer('book-fold-shadow');
    const backShade = makeLayer('book-fold-shadow');
    scene.setAttribute('aria-hidden', 'true');
    scene.inert = true;
    hinge.dataset.direction = forward ? 'forward' : 'back';
    position(hinge, { ...start, x: hingeStart });
    outer.append(copyPaper(front.paper), frontShade);
    inner.append(copyPaper(this.pages[targetIndex].paper), backShade);
    sheet.append(outer, inner);
    hinge.append(sheet);
    const stationary = old.length === 2 ? makeLayer('book-previous') : null;
    if (stationary) {
      const previous = old[forward ? 0 : 1];
      position(stationary, relativeTo(previous.box, origin));
      stationary.append(copyPaper(previous.paper));
      scene.append(stationary);
    }
    scene.append(hinge);
    target.classList.add('is-turning');
    this.frame.append(scene);

    const timing = { duration: 440, easing: 'cubic-bezier(.38,.10,.30,1)', fill: 'both' };
    const angle = forward ? -180 : 180;
    const effects = [
      hinge.animate([
        { transform: 'translate(0, 0) scale(1)' },
        { transform: 'translate(' + (hingeEnd - hingeStart) + 'px, ' + (end.y - start.y) + 'px) scale(' +
          end.width / start.width + ', ' + end.height / start.height + ')' },
      ], timing),
      sheet.animate([
        { transform: 'rotateY(0deg) skewY(0deg)' },
        { transform: 'rotateY(' + angle * .5 + 'deg) skewY(' + (forward ? -2 : 2) + 'deg)', offset: .5 },
        { transform: 'rotateY(' + angle + 'deg) skewY(0deg)' },
      ], timing),
      frontShade.animate([{ opacity: .08 }, { opacity: .7, offset: .54 }, { opacity: .16 }], timing),
      backShade.animate([{ opacity: .25 }, { opacity: .61, offset: .51 }, { opacity: 0 }], timing),
    ];
    const revealedPage = leaves.length === 2 ? leaves[1 - targetIndex] : null;
    if (revealedPage && old.length === 1) {
      effects.push(revealedPage.animate([{ opacity: .04 }, { opacity: 1, offset: .77 }, { opacity: 1 }], timing));
    }
    if (stationary) {
      effects.push(stationary.animate([{ opacity: 1 }, { opacity: 1, offset: .62 }, { opacity: 0 }], timing));
    }
    this.finishTurn = () => {
      this.finishTurn = null;
      target.classList.remove('is-turning');
      for (const effect of effects) effect.cancel();
      scene.remove();
    };
    const finish = this.finishTurn;
    effects[1].finished.then(() => {
      if (this.finishTurn === finish) finish();
    }, () => {});
  }

  pointerDown(event) {
    if (!event.isPrimary || event.button !== 0 || !this.pages.length || this.zoom > 1) return;
    if (event.pointerType !== 'touch' && !event.target.closest('.book-page')) return;
    this.ignoreClick = false;
    this.gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
  }

  pointerUp(event) {
    const start = this.gesture;
    if (!start || start.id !== event.pointerId) return;
    this.gesture = null;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    if (Math.abs(dx) >= 45 && Math.abs(dx) > Math.abs(dy) * 1.35) {
      this.ignoreClick = true;
      this.onTurn(dx < 0 ? 1 : -1);
    }
  }

  clickPage(event) {
    if (this.ignoreClick) {
      this.ignoreClick = false;
      return;
    }
    if (this.zoom > 1 || !event.target.closest('.book-page')) return;
    const box = this.frame.getBoundingClientRect();
    const position = (event.clientX - box.left) / box.width;
    if (position <= .24) this.onTurn(-1);
    if (position >= .76) this.onTurn(1);
  }
}

(() => {
  'use strict';
  const id = name => document.getElementById(name);
  const { pages, animation } = JSON.parse(id('flipstudio-data').textContent);
  const stage = id('stage');
  const paper = id('paper');
  const number = id('page');
  const previous = [id('prev'), id('toolbar-prev')];
  const next = [id('next'), id('toolbar-next')];
  const toggle = id('search-toggle');
  const search = id('search-panel');
  const layout = id('layout');
  const narrow = matchMedia(SINGLE_PAGE_QUERY);
  const clamp = (number, lower, upper) => Math.max(lower, Math.min(upper, number));
  const book = new BookView(stage, paper, turn);
  let active = 1;
  let singlePage = false;
  let visiblePages = [];
  let revision = 0;

  function getSpread() {
    return spreadFor(active, pages.length, narrow.matches || singlePage);
  }

  function updateControls(spread) {
    number.value = spreadLabel(spread);
    for (const button of previous) button.disabled = spread[0] === 1;
    for (const button of next) button.disabled = spread.at(-1) === pages.length;
    layout.disabled = narrow.matches;
    layout.setAttribute('aria-pressed', String(!singlePage && !narrow.matches));
    id('smaller').disabled = book.zoom === ZOOM_LEVELS[0];
    id('larger').disabled = book.zoom === ZOOM_LEVELS.at(-1);
    id('fit').textContent = Math.round(book.zoom * 100) + '%';
    id('transcript').textContent = pages[active - 1].text || 'Halaman ini tidak memiliki teks yang dapat diekstrak.';
    for (const result of id('results').querySelectorAll('button')) {
      if (Number(result.dataset.page) === active) result.setAttribute('aria-current', 'page');
      else result.removeAttribute('aria-current');
    }
  }

  function turn(step) {
    void show(stepFrom(getSpread(), step, pages.length));
  }

  async function loadLeaf(number) {
    const { width, height, src } = pages[number - 1];
    const image = new Image(width, height);
    image.alt = 'Halaman ' + number + ' dari ' + pages.length;
    image.draggable = false;
    image.src = src;
    await image.decode();
    return { paper: image, width, height };
  }

  async function show(target, animate = true) {
    active = clamp(target, 1, pages.length);
    const current = ++revision;
    const spread = getSpread();
    updateControls(spread);
    const feedback = id('read-status');
    feedback.hidden = true;
    if (visiblePages.join(',') === spread.join(',')) {
      paper.setAttribute('aria-busy', 'false');
      return;
    }
    if (!visiblePages.length) {
      feedback.textContent = 'Memuat halaman…';
      feedback.hidden = false;
    }
    paper.setAttribute('aria-busy', 'true');
    try {
      const leaves = await Promise.all(spread.map(loadLeaf));
      if (current !== revision) return;
      const direction = animation && animate && visiblePages.length ? Math.sign(spread[0] - visiblePages[0]) : 0;
      book.show(leaves, direction);
      visiblePages = spread;
      feedback.hidden = true;
      id('announcement').textContent = 'Halaman ' + spreadLabel(spread) + ' dari ' + pages.length;
    } catch {
      if (current !== revision) return;
      feedback.textContent = 'Halaman ' + spreadLabel(spread) + ' gagal dimuat.';
      feedback.hidden = false;
    } finally {
      if (current === revision) paper.setAttribute('aria-busy', 'false');
    }
  }

  function setSearch(open) {
    search.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    book.fit();
    (open ? id('query') : toggle).focus();
  }

  function moveZoom(step) {
    const index = clamp(ZOOM_LEVELS.indexOf(book.zoom) + step, 0, ZOOM_LEVELS.length - 1);
    book.setZoom(ZOOM_LEVELS[index]);
    updateControls(getSpread());
  }

  function runSearch() {
    const query = id('query').value.normalize('NFKC').trim().replace(/\s+/g, ' ').toLocaleLowerCase('id');
    const results = id('results');
    results.replaceChildren();
    if (query.length < 2) {
      id('search-status').textContent = 'Masukkan setidaknya dua karakter.';
      return;
    }
    for (const [index, page] of pages.entries()) {
      const text = page.text.normalize('NFKC');
      const found = text.toLocaleLowerCase('id').indexOf(query);
      if (found < 0) continue;
      const target = index + 1;
      const item = document.createElement('button');
      const heading = document.createElement('strong');
      const snippet = document.createElement('span');
      heading.textContent = 'Halaman ' + target;
      const start = Math.max(0, found - 32);
      const end = Math.min(text.length, found + query.length + 47);
      snippet.textContent = (start ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
      item.type = 'button';
      item.className = 'result-button';
      item.dataset.page = target;
      if (target === active) item.setAttribute('aria-current', 'page');
      item.append(heading, snippet);
      item.addEventListener('click', () => {
        void show(target);
        if (narrow.matches) setSearch(false);
      });
      results.append(item);
    }
    const count = results.childElementCount;
    id('search-status').textContent = count ? count + ' halaman cocok.' : 'Tidak ada teks yang cocok.';
  }

  for (const button of previous) button.addEventListener('click', () => turn(-1));
  for (const button of next) button.addEventListener('click', () => turn(1));
  bindPageEntry(id('page-form'), number, target => void show(target), () => spreadLabel(getSpread()));
  narrow.addEventListener('change', () => void show(active, false));
  layout.addEventListener('click', () => {
    singlePage = !singlePage;
    void show(active, false);
  });
  id('smaller').addEventListener('click', () => moveZoom(-1));
  id('larger').addEventListener('click', () => moveZoom(1));
  id('fit').addEventListener('click', () => {
    book.setZoom(1);
    updateControls(getSpread());
  });
  const fullscreen = id('fullscreen');
  fullscreen.disabled = !document.fullscreenEnabled;
  fullscreen.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {
      id('announcement').textContent = 'Layar penuh gagal diaktifkan.';
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? 'Keluar dari layar penuh' : 'Layar penuh';
    fullscreen.title = label;
    fullscreen.setAttribute('aria-label', label);
  });
  toggle.addEventListener('click', () => setSearch(search.hidden));
  id('search-close').addEventListener('click', () => setSearch(false));
  id('search-submit').addEventListener('click', runSearch);
  id('search-form').addEventListener('submit', event => {
    event.preventDefault();
    runSearch();
  });
  id('query').addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.isComposing) return;
    event.preventDefault();
    runSearch();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !search.hidden) setSearch(false);
    if (event.defaultPrevented || event.altKey || event.metaKey || event.ctrlKey || event.target.matches?.('input, select, textarea')) return;
    const actions = {
      ArrowLeft: () => turn(-1),
      ArrowRight: () => turn(1),
      Home: () => void show(1),
      End: () => void show(pages.length),
    };
    if (Object.hasOwn(actions, event.key)) {
      event.preventDefault();
      actions[event.key]();
    }
  });
  const incoming = Number(location.hash.match(/^#page=(\d+)$/)?.[1] || 1);
  id('total').textContent = pages.length;
  number.setAttribute('aria-label', 'Nomor halaman dari ' + pages.length);
  void show(incoming, false);
})();
</script></body></html>
